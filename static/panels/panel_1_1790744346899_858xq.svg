<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 512" width="768" height="512">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12192e"/>
      <stop offset="100%" stop-color="#243b6b"/>
    </linearGradient>
    <radialGradient id="sunGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdf6d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
    <pattern id="halftone1" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Sky -->
  <rect width="768" height="512" fill="url(#bgGrad1)"/>
  <rect width="768" height="260" fill="url(#halftone1)"/>

  <!-- Celestial Glow / Sun -->
  <circle cx="384" cy="220" r="140" fill="url(#sunGrad1)"/>
  <circle cx="384" cy="220" r="45" fill="#ffdf6d"/>

  <!-- Distant Mountain Silhouettes -->
  <polygon points="0,380 140,260 280,360 460,230 620,350 768,270 768,512 0,512" fill="#080c14" opacity="0.7"/>

  <!-- Foreground Terrain -->
  <polygon points="0,512 0,390 190,360 380,410 580,350 768,390 768,512" fill="#05070a"/>

  <!-- Hero Character Silhouette -->
  <g transform="translate(370, 310)">
    <!-- Cloak & Body -->
    <path d="M14,90 L-14,90 L-8,30 L8,30 Z" fill="#030406"/>
    <!-- Head & Hair -->
    <circle cx="0" cy="18" r="12" fill="#030406"/>
    <!-- Raised Staff / Arm -->
    <line x1="8" y1="40" x2="35" y2="10" stroke="#030406" stroke-width="4"/>
    <!-- Glowing Gem on Staff -->
    <circle cx="36" cy="8" r="7" fill="#f5c518"/>
    <circle cx="36" cy="8" r="14" fill="#f5c518" opacity="0.3"/>
  </g>

  <!-- Comic Outer Border -->
  <rect x="0" y="0" width="768" height="512" fill="none" stroke="#000000" stroke-width="12"/>
  <rect x="6" y="6" width="756" height="500" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>

  <!-- Panel Number Badge -->
  <rect x="24" y="24" width="130" height="38" rx="4" fill="#f5c518" stroke="#000000" stroke-width="3"/>
  <text x="89" y="49" fill="#000000" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">PANEL #1</text>

  <!-- Style Tag -->
  <rect x="610" y="24" width="134" height="34" rx="4" fill="#000000" stroke="#f5c518" stroke-width="2"/>
  <text x="677" y="46" fill="#f5c518" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">COMIC BOOK</text>

  <!-- Bottom Prompt Snippet -->
  <rect x="24" y="464" width="720" height="28" rx="3" fill="#080c14" opacity="0.9" stroke="#334155" stroke-width="1"/>
  <text x="36" y="482" fill="#94a3b8" font-family="monospace" font-size="11">Scene: The Call to Adventure | Prompt: A character named Luna standing at the threshold of Enchanted Forest, ...</text>
</svg>